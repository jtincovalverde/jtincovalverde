name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Bahamonde CRM static pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/bahamonde-crm docs/crm-bahamonde

          CRM_URL="https://dasheilkvbzaoqyzeicc.supabase.co/functions/v1/bahamonde?k=bahamonde-crm-2026&build=${GITHUB_SHA}"
          SUPABASE_JS_URL="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"

          curl --fail --silent --show-error --location "$CRM_URL" --output /tmp/bahamonde-index.html
          curl --fail --silent --show-error --location "$SUPABASE_JS_URL" --output /tmp/supabase.min.js

          test -s /tmp/supabase.min.js
          grep -q "createClient" /tmp/supabase.min.js

          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('/tmp/bahamonde-index.html')
          html = src.read_text(encoding='utf-8')
          if '<!doctype html' not in html.lower() or '</html>' not in html.lower():
              raise SystemExit('Bahamonde CRM release is not valid HTML')
          if 'id="af"' not in html or 'signInWithPassword' not in html:
              raise SystemExit('Bahamonde CRM auth code is missing')

          html = re.sub(
              r'<link\s+rel=["\']manifest["\'][^>]*>',
              '<link rel="manifest" href="./manifest.webmanifest">',
              html,
              count=1,
              flags=re.I,
          )
          html = re.sub(
              r'<script\s+src=["\']https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2\.57\.4/dist/umd/supabase\.min\.js["\']\s*></script>',
              '<script src="./supabase.min.js"></script>',
              html,
              count=1,
              flags=re.I,
          )
          html = html.replace('navigator.serviceWorker.register("./sw.js")', 'Promise.resolve()')
          html = html.replace("navigator.serviceWorker.register('./sw.js')", 'Promise.resolve()')

          # Extract the main inline application script for syntax validation with Node.
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          app_scripts = [s for s in scripts if 'signInWithPassword' in s or 'function boot' in s]
          if not app_scripts:
              raise SystemExit('Could not locate Bahamonde CRM application script')
          Path('/tmp/bahamonde-app.js').write_text(app_scripts[-1], encoding='utf-8')

          probe = '''<script>
          window.addEventListener('error', function(e){console.error('Bahamonde CRM runtime error:', e.error || e.message);});
          window.addEventListener('unhandledrejection', function(e){console.error('Bahamonde CRM promise error:', e.reason);});
          </script>'''
          html = html.replace('</head>', probe + '</head>', 1)

          for folder in ('docs/bahamonde-crm', 'docs/crm-bahamonde'):
              out = Path(folder)
              out.mkdir(parents=True, exist_ok=True)
              (out / 'index.html').write_text(html, encoding='utf-8')
              (out / 'supabase.min.js').write_bytes(Path('/tmp/supabase.min.js').read_bytes())
          PY

          echo "Checking CRM application JavaScript syntax..."
          node --check /tmp/bahamonde-app.js

          cp docs/bahamonde-crm/manifest.webmanifest docs/crm-bahamonde/manifest.webmanifest
          cp docs/bahamonde-crm/icon.svg docs/crm-bahamonde/icon.svg

          grep -q '<script src="./supabase.min.js"></script>' docs/crm-bahamonde/index.html
          grep -q 'signInWithPassword' docs/crm-bahamonde/index.html
          test -s docs/crm-bahamonde/supabase.min.js

          cat > docs/crm-bahamonde/sw.js <<'EOF'
          self.addEventListener('install', event => self.skipWaiting());
          self.addEventListener('activate', event => event.waitUntil((async()=>{
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
            await self.clients.claim();
          })()));
          self.addEventListener('fetch', event => {
            if (event.request.mode === 'navigate') {
              event.respondWith(fetch(event.request, {cache:'no-store'}).catch(()=>caches.match(event.request)));
            }
          });
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
