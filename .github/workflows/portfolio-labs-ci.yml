name: Portfolio Labs CI

on:
  push:
    branches: ["main"]
    paths:
      - "projects/demand-forecasting-demo/**"
      - ".github/workflows/portfolio-labs-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "projects/demand-forecasting-demo/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib numpy scikit-learn

      - name: Run demand forecasting demo
        run: python projects/demand-forecasting-demo/forecast.py
