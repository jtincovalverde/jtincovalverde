<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">MetalMueble MRP II case study</title>
  <desc id="desc">Visual summary showing 420 units, a 40-hour simulation horizon, welding as the bottleneck, and capacity required versus available.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1220"/><stop offset="1" stop-color="#111c30"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect width="1000" height="500" rx="28" fill="url(#bg)"/>
  <text x="52" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#7dd3fc">OPERATIONS CASE STUDY</text>
  <text x="52" y="116" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#f8fbff">MetalMueble · MRP II + FlexSim 2027</text>
  <text x="52" y="151" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#9fb0c6">Capacity planning, queue behavior, throughput and bottleneck analysis.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="52" y="194" width="210" height="116" rx="18" fill="#101e32" stroke="#263b58"/>
    <text x="76" y="230" font-size="13" fill="#8fa1b7">PRODUCTION LOT</text><text x="76" y="280" font-size="38" font-weight="800" fill="#f8fbff">420</text><text x="160" y="280" font-size="15" fill="#9fb0c6">units</text>
    <rect x="282" y="194" width="210" height="116" rx="18" fill="#101e32" stroke="#263b58"/>
    <text x="306" y="230" font-size="13" fill="#8fa1b7">SIMULATION</text><text x="306" y="280" font-size="38" font-weight="800" fill="#f8fbff">40</text><text x="366" y="280" font-size="15" fill="#9fb0c6">hours</text>
    <rect x="512" y="194" width="210" height="116" rx="18" fill="#101e32" stroke="#263b58"/>
    <text x="536" y="230" font-size="13" fill="#8fa1b7">BOTTLENECK</text><text x="536" y="280" font-size="28" font-weight="800" fill="#fb7185">Welding</text>
    <rect x="742" y="194" width="206" height="116" rx="18" fill="#101e32" stroke="#263b58"/>
    <text x="766" y="230" font-size="13" fill="#8fa1b7">CAPACITY GAP</text><text x="766" y="280" font-size="26" font-weight="800" fill="#f8fbff">+13.08 h</text>
  </g>
  <text x="52" y="364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8fa1b7">WELDING CAPACITY PRESSURE</text>
  <rect x="52" y="386" width="740" height="18" rx="9" fill="#17253a"/>
  <rect x="52" y="386" width="615" height="18" rx="9" fill="url(#bar)"/>
  <line x1="563" y1="374" x2="563" y2="416" stroke="#f8fbff" stroke-width="2" opacity=".72"/>
  <text x="52" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9fb0c6">64.77 h available</text>
  <text x="667" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#c9d5e4">77.85 h required</text>
  <text x="52" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#7dd3fc">Observe → Measure → Identify constraint → Test improvements</text>
</svg>